<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>토정비결 사주 대시보드</title>
<meta name="description" content="생년월일시로 사주팔자 원국과 올해의 토정비결 괘, 월별 운세를 한 화면에서 확인하는 대시보드">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=Noto+Serif+KR:wght@600;800&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <div class="wrap top-in">
    <div>
      <div class="eyebrow">四柱 · 土亭秘訣</div>
      <h1>토정비결 사주 대시보드</h1>
    </div>
    <button id="themeBtn" class="ghost" type="button" aria-label="화면 테마 전환">테마</button>
  </div>
</header>

<main class="wrap">
  <section class="panel" aria-labelledby="inTitle">
    <h2 id="inTitle">생년월일시 입력</h2>
    <form id="form" autocomplete="off">
      <div class="fields">
        <label>이름<input id="name" type="text" placeholder="홍길동" maxlength="20"></label>
        <fieldset class="seg"><legend>성별</legend>
          <label><input type="radio" name="gender" value="M" checked><span>남</span></label>
          <label><input type="radio" name="gender" value="F"><span>여</span></label>
        </fieldset>
        <fieldset class="seg"><legend>달력</legend>
          <label><input type="radio" name="cal" value="solar" checked><span>양력</span></label>
          <label><input type="radio" name="cal" value="lunar"><span>음력</span></label>
          <label><input type="radio" name="cal" value="leap"><span>음력 윤달</span></label>
        </fieldset>
        <label>생년월일<input id="date" type="text" inputmode="numeric" placeholder="1990-05-15 또는 19900515" value="1990-05-15" maxlength="10" required></label>
        <label>태어난 시각<input id="time" type="text" inputmode="numeric" placeholder="14:30 또는 1430" value="14:30" maxlength="5"></label>
        <label class="check"><input id="noTime" type="checkbox"><span>태어난 시각 모름</span></label>
        <label>토정비결 보는 해
          <select id="year"></select>
        </label>
      </div>
      <div class="actions">
        <button class="primary" type="submit">풀이 보기</button>
        <button id="saveBtn" class="ghost" type="button">이 사람 저장</button>
      </div>
      <p id="err" class="err" role="alert" hidden></p>
      <div id="saved" class="saved" hidden></div>
    </form>
  </section>

  <div id="result" hidden>
    <div class="who" id="who"></div>
    <nav class="tabs" role="tablist" aria-label="풀이 탭">
      <button role="tab" id="tab-saju" aria-controls="p-saju" aria-selected="true">사주</button>
      <button role="tab" id="tab-tj" aria-controls="p-tj" aria-selected="false">토정비결</button>
      <button role="tab" id="tab-all" aria-controls="p-all" aria-selected="false">종합</button>
    </nav>
    <section id="p-saju" role="tabpanel" aria-labelledby="tab-saju"></section>
    <section id="p-tj" role="tabpanel" aria-labelledby="tab-tj" hidden></section>
    <section id="p-all" role="tabpanel" aria-labelledby="tab-all" hidden></section>
  </div>
</main>

<footer class="wrap foot">
  <p>사주와 토정비결은 전통 문화·오락 콘텐츠입니다. 이 화면의 풀이는 규칙에 따라 만든 참고용 해석이며, 건강·재산·진로 같은 중요한 결정의 근거로 쓰지 마세요.</p>
  <p>토정비결 괘는 나이·생월·생일과 간지 수를 이용한 간이 계산이고, 문구는 전통 원문이 아닌 자체 해석 문구입니다. 만세력은 lunar-javascript 를 사용합니다.</p>
</footer>

<script src="https://cdn.jsdelivr.net/npm/lunar-javascript@1.6.12/lunar.js"></script>
<script src="engine.js"></script>
<script src="app.js"></script>
</body>
</html>
